services:
  - type: web
    name: revisionreel-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://revisionreel.vercel.app"
